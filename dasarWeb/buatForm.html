<html>
  <head>
    <title>Membuat Form</title>
  </head>

  <body>
    <form method="POST" action="gambar.html">
      <h4>FORM</h4>
      <input type="text" name="var1" size="30" value="Enter your name here." />
      <br /><br />
      <input type="text" name="var2" size="30" value="Enter your Address." />
      <br /><br />
      <b>Are you a student?</b>
      <input type="checkbox" name="var3" />
      <br /><br />
      <b>How old are you?</b>
      <br />
      <input type="radio" name="var4" value="r1" />10 – 15 <br />
      <input type="radio" name="var4" value="r2" />16 – 20 <br />
      <input type="radio" name="var4" value="r3" />21 – 25 <br /><br />

      <br /><br />
      <b>Which one do you have?</b>
      <br />
      <input type="checkbox" name="var7" value="bike" />I have a bike <br />
      <input type="radio" name="var4" value="r5" />I have a car <br />
      <input type="radio" name="var4" value="r6" />I have a boat <br />
      <input type="checkbox" name="var8" value="plane" />I have a plane
      <br /><br />

      <b>Where are you from</b>
      <br>
        <select name="var9" size="1">
            <option value="Indonesia" selected>Indonesia</option>
            <option value="BG">Bulgaria</option>
            <option value="UK">United Kingdom</option>
            <option value="USA">USA</option>
        </select>
        <br><br>

        <b>Enter your private code</b>
        <input type="text" name="code" id="code">
        <br><br>

        <b>Enter your comment</b>
        <br>
        <textarea type="text" name="code" id="code" placeholder="Fill this area"></textarea>
        <br><br>

      <input type="submit" name="var5" value="Send" />
      <input type="reset" name="var6" value="Clear" />
    </form>
  </body>
</html>

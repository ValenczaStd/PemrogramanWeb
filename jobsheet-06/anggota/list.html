<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SIMPUS-Mini | Daftar Anggota</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <header class="navbar navbar-expand-lg navbar-simpus">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="../index.html">SIMPUS-Mini</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navMenu"
          aria-controls="navMenu"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <nav class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="../index.html">Beranda</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../buku/list.html">Daftar Buku</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../buku/tambah.html">Tambah Buku</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="list.html">Daftar Anggota</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="tambah.html">Tambah Anggota</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="container my-4">
      <section class="card shadow-sm mb-4">
        <div class="card-body">
          <h2 class="card-title mb-3 text-brand">Daftar Anggota</h2>

          <div class="search-box">
            <label for="search-input">Cari Nama Anggota</label>
            <input
              type="text"
              id="search-input"
              placeholder="Ketik nama anggota..."
            />
          </div>

          <p id="loading-indicator" style="display:none;">Memuat data...</p>

          <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
              <thead class="table-brand">
                <tr>
                  <th>No. Anggota</th>
                  <th>Nama</th>
                  <th>Alamat</th>
                  <th>No. HP</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody>
                <!-- Baris diisi dinamis oleh assets/js/anggota.js via fetch('../data/anggota.json') -->
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <footer class="text-center py-3 text-secondary small">
      <p class="mb-0">&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 6 (Fetch API &amp; JSON)</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/anggota.js"></script>
  </body>
</html>
